# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 主库数据源
      master:
        driverClassName: com.kingbase8.Driver
        url: jdbc:kingbase8://192.168.1.99:54321/jy_management
        username: jinyang
        password: root
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        driverClassName:
        url:
        username:
        password:
      # 初始连接数
      initialSize: 1
      # 最小连接池数量
      minIdle: 1
      # 最大连接池数量
      maxActive: 2
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: jswkwl
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true


  mqtt:
    username:  # 用户名
    password:  # 密码
    hostUrl: tcp://192.168.1.117:1883 # tcp://ip:端口
    clientId: ClientId_local # 客户端id 必须唯一 比如你已经定了叫ABC  那你就一直叫ABC  其他地方就不要使用ABC了
    defaultTopic: 1 #MQTT-默认的消息推送主题，实际可在调用接口时指定 多个主题逗号分隔
    timeout: 1000 # 超时时间 （单位：秒）
    keepalive: 60 # 心跳 （单位：秒）
    configName: oxygen
  4gio:
    loginName: vh251113ddxx
    password: vh250527jyzn
  main:
    allow-circular-references: true
